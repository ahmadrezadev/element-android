[tool.towncrier]
    directory = "changelog.d"
    filename = "CHANGES.md"
    name = "Changes in Mana"
    template = "tools/towncrier/template.md"
    issue_format = "[#{issue}](https://github.com/mana-hq/mana-android/issues/{issue})"

    [[tool.towncrier.type]]
        directory = "feature"
        name = "Features ✨"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bugfixes 🐛"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "wip"
        name = "In development 🚧"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "doc"
        name = "Improved Documentation 📚"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "sdk"
        name = "SDK API changes ⚠️"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "misc"
        name = "Other changes"
        showcontent = true
